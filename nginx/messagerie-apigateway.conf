# Reverse proxy nginx pour l'API Gateway.
#
# ⚠️ POINT CLÉ pour l'envoi de médias : par défaut nginx limite le corps des
# requêtes à 1 Mo (`client_max_body_size 1m`), ce qui fait échouer (HTTP 413)
# toute photo > 1 Mo, vidéo ou document AVANT même d'atteindre l'app.
# La directive `client_max_body_size` ci-dessous lève cette limite.
#
# Si tu as déjà un server block qui fonctionne pour l'apigateway, il suffit
# d'y AJOUTER la ligne `client_max_body_size 120m;` (et de garder le reste).

server {
    listen 80;
    listen [::]:80;
    server_name messagerie-service-apigateway.wk-archi-o22a-15m-g1.fr;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name messagerie-service-apigateway.wk-archi-o22a-15m-g1.fr;

    ssl_certificate     /etc/letsencrypt/live/messagerie-service-apigateway.wk-archi-o22a-15m-g1.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/messagerie-service-apigateway.wk-archi-o22a-15m-g1.fr/privkey.pem;

    # >>> Indispensable pour les uploads (vidéos jusqu'à 100 Mo + marge). <<<
    client_max_body_size 120m;

    # Uploads longs : on laisse le temps au proxy de transmettre.
    proxy_connect_timeout 300s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_request_buffering off;

    location / {
        proxy_pass http://apigateway:8080;   # ou http://127.0.0.1:8080 selon ton setup
        proxy_http_version 1.1;

        # Support WebSocket (Socket.IO) :
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# À placer dans le contexte http{} (souvent déjà présent ailleurs) :
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
