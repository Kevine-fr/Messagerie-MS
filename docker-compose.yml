# Environnement de DEVELOPPEMENT (build local + hot reload via bind mounts).
# Demarrage : docker compose up -d --build
# Les variables ${...} ont des valeurs par defaut : aucun .env requis pour demarrer.

services:
  db:
    image: mysql:5.7
    container_name: messagerie-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-messagerie}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: messagerie-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-password}
    networks:
      - web

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: messagerie-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - web

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: messagerie-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - web

  # Cree les topics consommes par le service message, puis s'arrete.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: messagerie-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creation des topics Kafka...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.created --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.updated --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.deleted --partitions 1 --replication-factor 1
      echo 'Topics disponibles :'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    restart: "no"
    networks:
      - web

  mongodb:
    image: mongo:6.0
    container_name: messagerie-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  # Stockage objet S3-compatible pour les médias (photos, vidéos, documents).
  minio:
    image: minio/minio:latest
    container_name: messagerie-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    networks:
      - web

  # Crée le bucket et le rend lisible publiquement (anonymous download), puis s'arrête.
  minio-setup:
    image: minio/mc:latest
    container_name: messagerie-minio-setup
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-messagerie}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo 'attente MinIO...'; sleep 2; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set download local/$${MINIO_BUCKET};
      echo 'MinIO prêt (bucket public en lecture)';
      "
    restart: "no"
    networks:
      - web

  user:
    build:
      context: ./user
      dockerfile: Dockerfile.user
    container_name: messagerie-service-user
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-messagerie}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-password}
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: user-service-group
      # Stockage des médias via MinIO (compatible S3).
      MEDIA_DRIVER: minio
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-messagerie}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      # URL publique des médias (accessible depuis l'app). Émulateur Android :
      # http://10.0.2.2:9000/<bucket>. Appareil réel / web : http://<ip-host>:9000/<bucket>.
      AWS_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/messagerie}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./user:/var/www
    working_dir: /var/www
    command: sh -c "cp -n .env.example .env || true; composer install; php artisan migrate --force; php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - web

  message:
    build:
      context: ./message
      dockerfile: Dockerfile.message
    container_name: messagerie-service-message
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/messages_db
      KAFKA_URL: kafka:9092
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # Notifications push : le service account est lu depuis
      # message/firebase-service-account.json (monté dans le conteneur). Si le
      # fichier est absent, l'init échoue proprement et les push sont désactivés.
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/usr/src/app/firebase-service-account.json}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    volumes:
      - ./message:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - web

  # Consommateur Kafka (synchronise les users dans MongoDB).
  worker:
    build:
      context: ./message
      dockerfile: Dockerfile.message
    container_name: messagerie-consumer
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://mongodb:27017/messages_db
      KAFKA_URL: kafka:9092
      # Le consumer appelle le service message en HTTP pour synchroniser
      # la collection User (events user.created/updated/deleted).
      MESSAGE_SERVICE_URL: http://message:3000
    volumes:
      - ./message:/usr/src/app
      - /usr/src/app/node_modules
    command: node services/kafkaConsumer.js
    networks:
      - web

  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile.apigateway
    container_name: messagerie-service-apigateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - user
      - message
    environment:
      PORT: 8080
      USER_SERVICE_URL: http://user:8000
      MESSAGE_SERVICE_URL: http://message:3000
      JWT_SECRET: ${JWT_SECRET:-BQbrDxP4WWoMDUeTaTDeEs8wSsizAulUkAEuhCkua13s5wsP0MzN6kBovKz1djtQ}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - ./apigateway:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - web

volumes:
  db_data:
  mongodb_data:
  minio_data:

networks:
  web:
