name: CI/CD - Build, Push & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1) Calcule automatiquement la prochaine version SemVer et cree le tag git.
  #    patch par defaut ; utiliser "#minor" ou "#major" dans le message de commit
  #    pour incrementer la version mineure/majeure.
  version:
    name: Version (SemVer auto)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcul du tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GIT_TOKEN }}
          default_bump: patch
          release_branches: main

  # 2) Build + push des 3 images sur DockerHub (en parallele via matrix).
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        service: [apigateway, user, message]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/messagerie-${{ matrix.service }}:${{ needs.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/messagerie-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Deploiement sur le VPS : pull des images taguees + up.
  deploy:
    name: Deploiement VPS
    runs-on: ubuntu-latest
    needs: [version, build-and-push]
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ajout du VPS aux known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # .env de production genere depuis les secrets GitHub (heredoc quote => pas
      # d'expansion shell des valeurs, sans risque si elles contiennent des '$').
      - name: Generation du fichier .env
        run: |
          cat > .env.deploy <<'EOF'
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG=${{ needs.version.outputs.version }}
          APP_DOMAIN=${{ secrets.APP_DOMAIN }}
          APP_KEY=${{ secrets.APP_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CORS_ORIGIN=${{ secrets.CORS_ORIGIN }}
          DB_DATABASE=${{ secrets.DB_DATABASE }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
          CLOUDINARY_URL=${{ secrets.CLOUDINARY_URL }}
          MAIL_MAILER=${{ secrets.MAIL_MAILER }}
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME=Messagerie
          EOF

      - name: Copie du .env vers le VPS
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ secrets.PATH_DIR }}"
          scp .env.deploy ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ secrets.PATH_DIR }}/.env

      - name: Deploiement
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} bash -s <<'DEPLOY'
          set -e
          REPO_URL="git@github.com:${{ secrets.REPO_URL }}.git"

          cd ${{ secrets.PATH_DIR }}

          echo "Mise a jour du depot..."
          if [ ! -d .git ]; then
            git init -q
            git remote add origin "$REPO_URL" 2>/dev/null || git remote set-url origin "$REPO_URL"
          else
            git remote set-url origin "$REPO_URL"
          fi
          git fetch origin --prune
          # reset --hard conserve le .env (non suivi par git).
          git reset --hard origin/main

          echo "Reseau partage avec nginx..."
          docker network create web 2>/dev/null || true

          echo "Connexion a DockerHub..."
          printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

          echo "Pull + demarrage des conteneurs..."
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans --build

          docker image prune -f
          docker exec nginx nginx -s reload || true

          echo "Deploiement termine (version ${{ needs.version.outputs.version }})."
          DEPLOY

      - name: Resume
        run: |
          echo "## Production deployee 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Cle | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | https://${{ secrets.APP_DOMAIN }} |" >> $GITHUB_STEP_SUMMARY
