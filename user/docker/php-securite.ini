; Durcissement de PHP, chargé après les autres fichiers de conf.d (zz-).
; Recommandations publiées avec la version de sécurité du 19/11/2026.

; L'injection d'objets par la session (CVE-2026-115560, « PHP2Shell ») passe
; par la progression des téléversements, que le service n'utilise pas (les
; médias partent vers MinIO, l'API est sans session).
session.upload_progress.enabled = 0

; Les arguments des fonctions ne figurent plus dans les traces d'exception :
; ils y exposaient mots de passe et jetons, et nourrissaient les
; use-after-free des traces publiés le même jour.
zend.exception_ignore_args = On

; Ne pas annoncer la version de PHP (en-tête X-Powered-By).
expose_php = Off
