version: "3.9"

services:
  db:
    image: mysql:5.7
    container_name: mysql_messagerie
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: messagerie
      MYSQL_PASSWORD: password
    networks:
      - web

  app:
    build:
      context: ./user_service
      dockerfile: Dockerfile.prod
    container_name: user_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
      - kafka
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: messagerie
      DB_USERNAME: root
      DB_PASSWORD: password
    networks:
      - web

  zookeeper:
    image: zookeeper:3.8.6
    container_name: zookeeper_messagerie
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - web

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_messagerie
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "no"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
    depends_on:
      - zookeeper
    networks:
      - web

  mongodb:
    image: mongo:6
    container_name: mongodb_messagerie
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - web

  nodejs:
    build:
      context: ./message_service
      dockerfile: Dockerfile.prod
    container_name: message_service
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - kafka
      - mongodb
    networks:
      - web
    environment:
      MONGO_URI: mongodb://mongodb:27017/messages_db

  worker:
    build:
      context: ./message_service
      dockerfile: Dockerfile.consumer
    container_name: consumer_service
    restart: unless-stopped
    depends_on:
      - kafka
      - mongodb
    networks:
      - web
    environment:
      MONGO_URI: mongodb://mongodb:27017/messages_db

  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile.prod
    container_name: api_gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - web
    depends_on:
      - app
      - nodejs
    environment:
      USER_SERVICE_URL: http://user_service:8000
      MESSAGE_SERVICE_URL: http://message_service:3000
      JWT_SECRET: BQbrDxP4WWoMDUeTaTDeEs8wSsizAulUkAEuhCkua13s5wsP0MzN6kBovKz1djtQ

volumes:
  db_data:
  mongodb_data:

networks:
  web:
    external: true
