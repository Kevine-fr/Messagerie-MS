# Environnement de PRODUCTION (images pre-construites tirees de DockerHub).
# Les variables proviennent du fichier .env genere par la CI/CD sur le VPS.
# Reseau "web" externe : partage avec le reverse proxy nginx (termine le TLS).
#
# Plafonds de ressources (VPS mutualise 8 vCPU / 24 Go) : voir CAPACITY.md dans
# le depot Infrastructure. mem_limit est un garde-fou, pas une reservation ;
# cpu_shares ne joue qu'en cas de contention (1024 = prod, 256 = tache de fond).

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:5.7
    container_name: messagerie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: 1
    cpu_shares: 1024
    logging: *logging
    networks:
      - web

  # Exporter Prometheus de MySQL (job "mysql" cote Prometheus).
  # v0.14.0 volontairement : c'est la derniere version qui accepte un DSN via
  # DATA_SOURCE_NAME. Les versions >= 0.15 exigent un fichier .my.cnf monte.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: mysqld-exporter-messagerie
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "root:${DB_ROOT_PASSWORD}@(db:3306)/"
    expose:
      - "9104"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 96m
    cpus: 0.2
    cpu_shares: 256
    logging: *logging
    networks:
      - web

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: messagerie-kafka-init
    # depends_on:
    #   kafka:
    #     condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.created --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.updated --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic user.deleted --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    restart: "no"
    # Conteneur ephemere, mais il lance une JVM : sans borne elle vise un tas
    # dimensionne sur les 24 Go de l'hote, le temps de creer trois topics.
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    mem_limit: 512m
    cpus: 0.5
    cpu_shares: 256
    logging: *logging
    networks:
      - web

  mongodb:
    image: mongo:6.0
    container_name: messagerie-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    # WiredTiger dimensionne son cache sur la limite du cgroup : sans plafond,
    # il reserverait la moitie de la RAM de l'hote pour lui seul.
    mem_limit: 768m
    cpus: 1
    cpu_shares: 1024
    logging: *logging
    networks:
      - web

  # Exporter Prometheus de MongoDB (job "mongodb", label server=messagerie).
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: mongodb-exporter-messagerie
    restart: unless-stopped
    command:
      - '--mongodb.uri=mongodb://mongodb:27017'
      - '--collect-all'
      - '--compatible-mode'
    expose:
      - "9216"
    depends_on:
      mongodb:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.2
    cpu_shares: 256
    logging: *logging
    networks:
      - web

  # Crée le bucket et le rend public en lecture, puis s'arrête.
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-messagerie}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo 'attente MinIO...'; sleep 2; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set download local/$${MINIO_BUCKET};
      echo 'MinIO prêt';
      "
    restart: "no"
    mem_limit: 128m
    cpus: 0.3
    cpu_shares: 256
    logging: *logging
    networks:
      - web

  user:
    image: ${DOCKERHUB_USERNAME}/messagerie-user:${IMAGE_TAG:-latest}
    container_name: messagerie-service-user
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: https://${APP_DOMAIN}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: user-service-group
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      # Stockage des médias : MinIO (S3) par défaut. CLOUDINARY_URL reste lu si
      # MEDIA_DRIVER=cloudinary.
      MEDIA_DRIVER: ${MEDIA_DRIVER:-minio}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET:-messagerie}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      # URL publique des médias (sous-domaine nginx -> minio:9000). Ex :
      # https://media.mondomaine.com/messagerie
      AWS_URL: ${MINIO_PUBLIC_URL}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Messagerie}
    mem_limit: 512m
    cpus: 1
    cpu_shares: 1024
    logging: *logging
    networks:
      - web

  message:
    image: ${DOCKERHUB_USERNAME}/messagerie-message:${IMAGE_TAG:-latest}
    container_name: messagerie-service-message
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/messages_db
      KAFKA_URL: kafka:9092
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN manquant}
      # Notifications push (Firebase). Renseigner les 3 variables dans le .env
      # du VPS (la clé privée sur une ligne, retours échappés en \n). Vide =>
      # push désactivées (le service tourne quand même).
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
    mem_limit: 512m
    cpus: 1
    cpu_shares: 1024
    logging: *logging
    networks:
      - web

  # Meme image que "message", mais lance le consommateur Kafka.
  worker:
    image: ${DOCKERHUB_USERNAME}/messagerie-message:${IMAGE_TAG:-latest}
    container_name: messagerie-consumer
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://mongodb:27017/messages_db
      KAFKA_URL: kafka:9092
      # Le consumer appelle le service message en HTTP pour synchroniser
      # la collection User (events user.created/updated/deleted).
      MESSAGE_SERVICE_URL: http://message:3000
    command: node services/kafkaConsumer.js
    # Tache de fond : elle cede le CPU au trafic web en cas de contention.
    mem_limit: 384m
    cpus: 0.5
    cpu_shares: 256
    logging: *logging
    networks:
      - web

  apigateway:
    image: ${DOCKERHUB_USERNAME}/messagerie-apigateway:${IMAGE_TAG:-latest}
    container_name: messagerie-service-apigateway
    restart: unless-stopped
    # Expose uniquement sur la loopback de l'hote ; le reverse proxy nginx
    # (sur le reseau "web") joint apigateway via le DNS interne apigateway:8080.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - user
      - message
    environment:
      PORT: 8080
      USER_SERVICE_URL: http://user:8000
      MESSAGE_SERVICE_URL: http://message:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN manquant}
    mem_limit: 384m
    cpus: 1
    cpu_shares: 1024
    logging: *logging
    networks:
      - web

volumes:
  db_data:
  mongodb_data:

networks:
  web:
    external: true
